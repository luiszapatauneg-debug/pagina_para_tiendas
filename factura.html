<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Visual del Pedido - Tienda</title>
    <!-- Tus estilos generales o variables si los tienes -->
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .factura-container {
            max-width: 700px;
            margin: 0 auto;
            background: #1a1818;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
        }

        .factura-header {
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .factura-header h2 {
            margin: 0 0 5px 0;
            color: #ffffff;
        }

        .factura-header p {
            color: #aaa;
            font-size: 0.9rem;
            margin: 0;
        }

        .cliente-info {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }

        .cliente-info p {
            margin: 5px 0;
            font-size: 0.95rem;
            color: #ddd;
        }

        .cliente-info strong {
            color: #fff;
        }

        /* Tarjeta de producto de solo lectura */
        .factura-item-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .factura-item-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #111;
        }

        .factura-item-info {
            flex-grow: 1;
        }

        .factura-item-info h4 {
            color: #ffffff;
            font-size: 1.1rem;
            margin: 0 0 5px 0;
        }

        .factura-item-info p {
            color: #ccc;
            font-size: 0.85rem;
            margin: 0 0 4px 0;
        }

        .factura-item-subtotal {
            text-align: right;
        }

        .factura-item-subtotal p {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
            margin: 0;
        }

        .factura-total {
            margin-top: 20px;
            text-align: right;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            border-top: 2px solid #444;
            padding-top: 15px;
        }

        .error-mensaje {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="factura-container" id="factura-contenedor">
        <!-- El contenido se cargará dinámicamente con JavaScript -->
        <p style="text-align: center; color: #aaa;">Cargando detalles del pedido...</p>
    </div>

    <!-- Necesitamos la lista maestra de productos para poder buscar las imágenes oficiales -->
    <script src="productos.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Capturar el ID que viene en la URL (ej: ?id=pedido_1756041234567)
            const params = new URLSearchParams(window.location.search);
            const idPedido = params.get('id');

            const contenedor = document.getElementById('factura-contenedor');

            if (!idPedido) {
                contenedor.innerHTML = `<div class="error-mensaje">❌ No se encontró ningún identificador de pedido en el enlace.</div>`;
                return;
            }

            // 2. Buscar el pedido en el localStorage usando el ID
            const datosPedidoString = localStorage.getItem(idPedido);

            if (!datosPedidoString) {
                contenedor.innerHTML = `<div class="error-mensaje">⚠️ Este pedido no fue encontrado o ya expiró en la memoria de este dispositivo.</div>`;
                return;
            }

            const pedido = JSON.parse(datosPedidoString);
            const listaProductos = typeof productosData !== 'undefined' ? productosData : (typeof productos !== 'undefined' ? productos : []);

            // 3. Construir la estructura visual de la factura
            let html = `
                <div class="factura-header">
                    <h2>📋 Factura de Despacho</h2>
                    <p>ID: ${pedido.idPedido}</p>
                    <p>Fecha: ${pedido.fecha}</p>
                </div>

                <div class="cliente-info">
                    <p>📍 <strong>Sucursal:</strong> ${pedido.sucursal}</p>
                    <p>👤 <strong>Cliente:</strong> ${pedido.cliente}</p>
                    <p>🚚 <strong>Método de Entrega:</strong> ${pedido.entrega}</p>
                    ${pedido.entrega !== 'Retirar en Tienda' ? `<p>🏠 <strong>Zona / Sector:</strong> ${pedido.zona}</p>` : ''}
                    <p>💳 <strong>Método de Pago:</strong> ${pedido.pago}</p>
                </div>

                <h3>Productos solicitados:</h3>
                <div class="factura-items-list">
            `;

            let totalGeneral = 0;

            pedido.productos.forEach((item, index) => {
                let subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;

                // Buscamos la imagen oficial del producto en la lista maestra
                let productoOficial = listaProductos.find(p => p.id === item.id || (p.nombre && p.nombre.toLowerCase() === item.nombre.toLowerCase()));
                let imagen = productoOficial ? productoOficial.imagen : 'images/default.jpg';
                let descripcion = productoOficial && productoOficial.descripcion ? productoOficial.descripcion : '';

                // Preparamos variantes visuales (talla y color)
                let variacionesHtml = '';
                if (item.talla && item.talla !== 'N/A') {
                    variacionesHtml += `Talla: <strong>${item.talla}</strong> | `;
                }
                if (item.color && item.color !== 'N/A') {
                    let colorLower = item.color.toLowerCase().trim();
                    let mapaColores = {
                        'blanco': '#ffffff', 'negro': '#000000', 'rojo': '#ff0000',
                        'azul': '#0000ff', 'verde': '#008000', 'amarillo': '#ffff00',
                        'gris': '#808080', 'morado': '#800080', 'naranja': '#ffa500',
                        'rosado': '#ffc0cb', 'celeste': '#87ceeb'
                    };
                    let colorCss = mapaColores[colorLower] || item.color;
                    let esBlanco = colorLower === 'blanco' || colorCss === '#ffffff' || colorCss === '#fff';
                    let estiloBorde = esBlanco ? 'border: 1px solid #777;' : 'border: 1px solid transparent;';

                    variacionesHtml += `Color: <span style="display:inline-block; width:12px; height:12px; background:${colorCss}; border-radius:50%; vertical-align:middle; ${estiloBorde} margin-right: 3px;"></span> ${item.color}`;
                }

                html += `
                    <div class="factura-item-card">
                        <img src="${imagen}" alt="${item.nombre}">
                        
                        <div class="factura-item-info">
                            <h4>${index + 1}. ${item.nombre}</h4>
                            ${descripcion ? `<p>${descripcion}</p>` : ''}
                            ${variacionesHtml ? `<p>${variacionesHtml}</p>` : ''}
                            <p>Cantidad: <strong>x${item.cantidad}</strong> | Precio unitario: $${item.precio}</p>
                        </div>

                        <div class="factura-item-subtotal">
                            <p>$${subtotal.toFixed(2)}</p>
                        </div>
                    </div>
                `;
            });

            html += `
                </div>
                <div class="factura-total">
                    Total General: $${totalGeneral.toFixed(2)} USD
                </div>
            `;

            contenedor.innerHTML = html;
        });
    </script>
</body>
</html>
